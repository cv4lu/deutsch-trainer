<style>

</style></head><body><main class="wrap">

<script>
const DATA=[["Spaß haben an", "получать удовольствие от чего-либо", "Dativ", "an", "Ich habe Spaß an Deutsch."], ["teilnehmen an", "участвовать в чём-либо", "Dativ", "an", "Ich nehme an einem Kurs teil."], ["bestehen aus", "состоять из чего-либо", "Dativ", "aus", "Der Kurs besteht aus drei Teilen."], ["Mitleid haben mit", "сочувствовать кому-либо", "Dativ", "mit", "Ich habe Mitleid mit ihm."], ["glücklich sein mit", "быть довольным чем-либо / кем-либо", "Dativ", "mit", "Ich bin mit meiner Wahl glücklich."], ["sich streiten mit", "ссориться с кем-либо", "Dativ", "mit", "Ich streite mich mit meinem Bruder."], ["unzufrieden sein mit", "быть недовольным чем-либо", "Dativ", "mit", "Ich bin mit dem Ergebnis unzufrieden."], ["anfangen mit", "начинать с чего-либо", "Dativ", "mit", "Wir fangen mit der Aufgabe an."], ["beginnen mit", "начинать с чего-либо", "Dativ", "mit", "Sie beginnt mit dem Lernen."], ["einverstanden sein mit", "быть согласным с чем-либо / кем-либо", "Dativ", "mit", "Ich bin mit dir einverstanden."], ["verheiratet sein mit", "быть женатым / замужем за кем-либо", "Dativ", "mit", "Er ist mit Anna verheiratet."], ["verlobt sein mit", "быть помолвленным с кем-либо", "Dativ", "mit", "Sie ist mit Paul verlobt."], ["Schluss machen mit", "порвать с кем-либо; покончить с чем-либо", "Dativ", "mit", "Sie macht mit ihm Schluss."], ["sprechen mit", "разговаривать с кем-либо", "Dativ", "mit", "Ich spreche mit meiner Lehrerin."], ["sich sehnen nach", "тосковать по кому-либо / чему-либо", "Dativ", "nach", "Ich sehne mich nach meiner Heimat."], ["riechen nach", "пахнуть чем-либо", "Dativ", "nach", "Es riecht nach Kaffee."], ["schmecken nach", "иметь вкус чего-либо", "Dativ", "nach", "Die Suppe schmeckt nach Knoblauch."], ["sich erkundigen nach", "спрашивать о чём-либо; узнавать", "Dativ", "nach", "Ich erkundige mich nach dem Weg."], ["sich ekeln vor", "испытывать отвращение к чему-либо", "Dativ", "vor", "Ich ekle mich vor Spinnen."], ["sich fürchten vor", "бояться кого-либо / чего-либо", "Dativ", "vor", "Sie fürchtet sich vor Hunden."], ["Angst haben vor", "бояться кого-либо / чего-либо", "Dativ", "vor", "Ich habe Angst vor Prüfungen."], ["weinen vor", "плакать от чего-либо", "Dativ", "vor", "Er weint vor Freude."], ["enttäuscht sein von", "быть разочарованным кем-либо / чем-либо", "Dativ", "von", "Ich bin von dem Film enttäuscht."], ["schwärmen von", "восторженно рассказывать о чём-либо", "Dativ", "von", "Sie schwärmt von Wien."], ["hören von", "слышать о ком-либо / чём-либо", "Dativ", "von", "Ich habe von ihm gehört."], ["begeistert sein von", "быть в восторге от чего-либо", "Dativ", "von", "Ich bin von der Idee begeistert."], ["abhängig sein von", "зависеть от чего-либо / кого-либо", "Dativ", "von", "Das hängt vom Wetter ab."], ["sprechen von", "говорить о ком-либо / чём-либо", "Dativ", "von", "Wir sprechen von unserer Reise."], ["reden von", "говорить о ком-либо / чём-либо", "Dativ", "von", "Er redet von seiner Arbeit."], ["träumen von", "мечтать о чём-либо", "Dativ", "von", "Ich träume von einer Reise."], ["denken an", "думать о ком-либо / чём-либо", "Akkusativ", "an", "Ich denke an dich."], ["sich erinnern an", "вспоминать о ком-либо / чём-либо", "Akkusativ", "an", "Ich erinnere mich an den Tag."], ["sich gewöhnen an", "привыкать к чему-либо", "Akkusativ", "an", "Ich gewöhne mich an das Wetter."], ["glauben an", "верить в кого-либо / что-либо", "Akkusativ", "an", "Ich glaube an dich."], ["wütend sein auf", "злиться на кого-либо", "Akkusativ", "auf", "Er ist wütend auf mich."], ["sich freuen auf", "радоваться чему-либо в будущем", "Akkusativ", "auf", "Ich freue mich auf das Wochenende."], ["hoffen auf", "надеяться на что-либо", "Akkusativ", "auf", "Wir hoffen auf gutes Wetter."], ["stolz sein auf", "гордиться кем-либо / чем-либо", "Akkusativ", "auf", "Ich bin stolz auf dich."], ["aufpassen auf", "присматривать за кем-либо / чем-либо", "Akkusativ", "auf", "Ich passe auf das Kind auf."], ["warten auf", "ждать кого-либо / чего-либо", "Akkusativ", "auf", "Ich warte auf den Bus."], ["verzichten auf", "отказываться от чего-либо", "Akkusativ", "auf", "Ich verzichte auf Zucker."], ["sich interessieren für", "интересоваться чем-либо", "Akkusativ", "für", "Ich interessiere mich für Musik."], ["danken für", "благодарить за что-либо", "Akkusativ", "für", "Ich danke dir für deine Hilfe."], ["sich bedanken für", "благодарить за что-либо", "Akkusativ", "für", "Ich bedanke mich für das Geschenk."], ["lernen für", "готовиться к чему-либо; учить для чего-либо", "Akkusativ", "für", "Ich lerne für die Prüfung."], ["protestieren gegen", "протестовать против чего-либо", "Akkusativ", "gegen", "Sie protestieren gegen den Plan."], ["sich verlieben in", "влюбиться в кого-либо", "Akkusativ", "in", "Er hat sich in sie verliebt."], ["sich Sorgen machen um", "беспокоиться о ком-либо / чём-либо", "Akkusativ", "um", "Ich mache mir Sorgen um dich."], ["sich sorgen um", "беспокоиться о ком-либо / чём-либо", "Akkusativ", "um", "Sie sorgt sich um ihren Sohn."], ["beneiden um", "завидовать кому-либо из-за чего-либо", "Akkusativ", "um", "Ich beneide dich um deinen Erfolg."], ["bitten um", "просить о чём-либо", "Akkusativ", "um", "Ich bitte dich um Hilfe."], ["sich kümmern um", "заботиться о ком-либо / чём-либо", "Akkusativ", "um", "Ich kümmere mich um den Hund."], ["sich amüsieren über", "забавляться чем-либо", "Akkusativ", "über", "Wir amüsieren uns über den Witz."], ["traurig sein über", "грустить из-за чего-либо", "Akkusativ", "über", "Ich bin traurig über die Nachricht."], ["wütend sein über", "злиться из-за чего-либо", "Akkusativ", "über", "Sie ist wütend über den Fehler."], ["sich freuen über", "радоваться чему-либо уже произошедшему", "Akkusativ", "über", "Ich freue mich über dein Geschenk."], ["sich ärgern über", "раздражаться из-за чего-либо", "Akkusativ", "über", "Ich ärgere mich über den Lärm."], ["sich wundern über", "удивляться чему-либо", "Akkusativ", "über", "Ich wundere mich über seine Antwort."], ["glücklich sein über", "быть счастливым из-за чего-либо", "Akkusativ", "über", "Sie ist glücklich über den Erfolg."], ["überrascht sein über", "быть удивлённым чем-либо", "Akkusativ", "über", "Wir sind über das Ergebnis überrascht."], ["staunen über", "удивляться чему-либо", "Akkusativ", "über", "Alle staunen über das Ergebnis."], ["enttäuscht sein über", "быть разочарованным чем-либо", "Akkusativ", "über", "Ich bin über das Ergebnis enttäuscht."], ["lachen über", "смеяться над чем-либо", "Akkusativ", "über", "Wir lachen über den Film."], ["nachdenken über", "размышлять о чём-либо", "Akkusativ", "über", "Ich denke über deine Frage nach."], ["sich informieren über", "узнавать / получать информацию о чём-либо", "Akkusativ", "über", "Ich informiere mich über den Kurs."]];
const PREPS=["an","auf","aus","mit","nach","vor","von","für","gegen","in","um","über"];
const state={mode:"cards",filter:"all",deck:[],pos:0,flipped:false,answered:false,known:new Set(JSON.parse(localStorage.getItem("dt-known")||"[]")),wrong:new Set(JSON.parse(localStorage.getItem("dt-wrong")||"[]")),correct:Number(localStorage.getItem("dt-correct")||0),attempts:Number(localStorage.getItem("dt-attempts")||0)};
const $=s=>document.querySelector(s);
function persist(){localStorage.setItem("dt-known",JSON.stringify([...state.known]));localStorage.setItem("dt-wrong",JSON.stringify([...state.wrong]));localStorage.setItem("dt-correct",state.correct);localStorage.setItem("dt-attempts",state.attempts)}
function stats(){$("#knownCount").textContent=state.known.size;$("#scoreCount").textContent=state.correct+"/"+state.attempts;$("#progressCount").textContent=Math.round(state.known.size/DATA.length*100)+"%"}
function filtered(){return DATA.map((d,i)=>({d,i})).filter(x=>state.filter==="all"||(state.filter==="wrong"?state.wrong.has(x.i):x.d[2]===state.filter))}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){state.deck=shuffle(filtered().map(x=>x.i));state.pos=0;state.flipped=false;state.answered=false;render()}
function btn(t,a,cl="btn"){return `<button class="btn ${cl}" data-action="${a}">${t}</button>`}
function render(){stats();const s=$("#stage");if(state.mode==="dictionary"){const entries=filtered();s.innerHTML=`<h2 style="margin:0 0 12px">Словарь <span class="muted">(${entries.length})</span></h2><input class="search" id="search" placeholder="Найти глагол или перевод…"><div id="entries">${entries.map(entry).join("")}</div>`;$("#search").oninput=()=>{let q=$("#search").value.toLowerCase();$("#entries").innerHTML=entries.filter(x=>(x.d[0]+" "+x.d[1]+" "+x.d[3]).toLowerCase().includes(q)).map(entry).join("")};return}
if(!state.deck.length||state.pos>=state.deck.length){s.innerHTML=`<div class="cardface"><div class="word">${state.deck.length?"Раунд завершён!":"Нет карточек"}</div><p class="muted">${state.deck.length?`Ты прошёл(ла) ${state.deck.length} карточек.`:"В этой категории пока нет ошибок. Попробуй режим «Все»."}</p>${btn("Начать заново","restart","primary")}</div>`;return}
let id=state.deck[state.pos],d=DATA[id],n=state.pos+1,total=state.deck.length;
if(state.mode==="cards"){s.innerHTML=`<div class="row"><span class="tag">${d[2]}</span><span class="muted">${n} / ${total}</span></div><div class="progress"><div style="width:${(n-1)/total*100}%"></div></div><button class="cardface" id="flip" style="width:100%;border:0;background:transparent;color:inherit"><div class="word">${d[0]}</div><div class="muted">${state.flipped?"Перевод":"Нажми, чтобы открыть ответ"}</div>${state.flipped?`<div class="translation">${d[1]}</div><div class="example">${d[4]}</div>`:""}</button><div class="btnrow">${btn("←","prev")}${btn("Не знаю ×","unknown")}${btn("Знаю ✓","known","primary")}</div>`;$("#flip").onclick=()=>{state.flipped=!state.flipped;render()};return}
let options=shuffle([d[3],...shuffle(PREPS.filter(p=>p!==d[3])).slice(0,3)]);s.innerHTML=`<div class="row"><span class="tag">${d[2]}</span><span class="muted">${n} / ${total}</span></div><div class="progress"><div style="width:${(n-1)/total*100}%"></div></div><p class="muted">Выбери правильный предлог</p><div class="word">${d[0].replace(d[3],"_____")}</div><div class="options">${options.map(p=>`<button class="option" data-option="${p}" ${state.answered?"disabled":""}>${p}</button>`).join("")}</div><div id="feedback"></div><div class="btnrow">${btn(state.answered?"Следующий →":"Пропустить →",state.answered?"next":"skip","primary")}</div>`;
if(state.answered)showFeedback(d,d[3]);s.querySelectorAll("[data-option]").forEach(b=>b.onclick=()=>{if(state.answered)return;state.answered=true;state.attempts++;let ok=b.dataset.option===d[3];if(ok){state.correct++;state.wrong.delete(id)}else state.wrong.add(id);persist();s.querySelectorAll("[data-option]").forEach(o=>{o.disabled=true;if(o.dataset.option===d[3])o.classList.add("good");else if(o===b)o.classList.add("bad")});showFeedback(d,d[3],ok);stats();s.querySelector('[data-action]').textContent="Следующий →";s.querySelector('[data-action]').dataset.action="next"})}
function showFeedback(d,prep,ok){$("#feedback").innerHTML=`<div class="feedback"><b>${ok===undefined?"Ответ: "+prep:ok?"✓ Правильно!":"✗ Правильный ответ: "+prep}</b><br>${d[0]} — ${d[1]}<br><span class="muted">${d[4]}</span></div>`}
function entry(x){return `<article class="entry"><div class="row"><b>${x.d[0]}</b><span class="tag">${x.d[2]}</span></div><p>${x.d[1]}</p><small>${x.d[4]}</small></article>`}
function advance(){state.pos++;state.flipped=false;state.answered=false;render()}
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;document.querySelectorAll("[data-mode]").forEach(x=>x.classList.toggle("active",x===b));start()});
document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active",x===b));start()});
$("#stage").addEventListener("click",e=>{const b=e.target.closest("[data-action]");if(!b)return;switch(b.dataset.action){case"prev":state.pos=Math.max(0,state.pos-1);state.flipped=false;state.answered=false;render();break;case"known":state.known.add(state.deck[state.pos]);persist();advance();break;case"unknown":state.known.delete(state.deck[state.pos]);state.wrong.add(state.deck[state.pos]);persist();advance();break;case"skip":advance();break;case"next":advance();break;case"restart":start();break}});
if("serviceWorker" in navigator && location.protocol!=="file:")navigator.serviceWorker.register("./sw.js").catch(()=>{});
start();
</script></body></html>
